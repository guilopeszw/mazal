<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!--
    Carbonless copy stock. Real paper is not a flat fill: the pulp mottles, the coating sits
    unevenly, and the sheet carries a faint laid direction from the machine that made it. This
    is the ground asset, tiled — the previous build painted #d9e0ce and called it stock.

    Two octaves of fractal noise at a low frequency give the cloudy mottle; a second, much
    finer pass stretched along x gives the fibre. Both sit at a few percent alpha, because
    paper you can *see* the texture of is a texture, and paper you can only tell is not flat is
    paper.
  -->
  <defs>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="7" stitchTiles="stitch" result="clouds"/>
      <feColorMatrix in="clouds" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.10" intercept="0"/>
      </feComponentTransfer>
    </filter>

    <filter id="fibre" x="0" y="0" width="100%" height="100%" primitiveUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="19" stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="420" height="420" fill="#d9e0ce"/>
  <rect width="420" height="420" filter="url(#mottle)" opacity="0.85"/>
  <rect width="420" height="420" filter="url(#fibre)" opacity="0.7"/>
</svg>
